plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Mixins in the dependency mods only apply in dev runs if their refmaps are remapped to our names.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Hot reload for dev runs: ./gradlew runClient -PhotReload (or runServer), then `bash tools/hotswap.sh` after edits.
// Game runs use JetBrains Runtime 17 with enhanced class redefinition + HotswapAgent; compiling still uses JDK 17.
// Changes are pushed over the local-only debug port 5005 (HotswapAgent's own file watcher can't see Forge's class loader).
if (project.hasProperty('hotReload')) {
    def jbr = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
        vendor = JvmVendorSpec.JETBRAINS
    }
    tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
        javaLauncher = jbr
        doFirst {
            def agent = new File(jbr.get().metadata.installationPath.asFile, 'lib/hotswap/hotswap-agent.jar')
            jvmArgs '-XX:+AllowEnhancedClassRedefinition', "-javaagent:${agent}=disablePlugin=Log4j2",
                    '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/jdk.internal.loader=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.net=ALL-UNNAMED',
                    '-Xlog:redefine+class*=info',
                    '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
        }
    }
}

// Client smoke test: ./gradlew runClient -PsmokeTest (better: bash tools/smoketest.sh). The client creates a fresh
// world, walks around, runs the steps in client/smoketest, takes screenshots and quits.
if (project.hasProperty('smokeTest')) {
    tasks.matching { it.name == 'runClient' }.configureEach {
        systemProperty 'wallis_ultimate.smoketest', 'true'
    }
}

// Pack config (History Stages stages and settings, ...) lives in pack/config and is copied into the dev run before
// every client or server start, so pack/config is the source of truth: edits made in run/config get overwritten.
def syncPackConfig = tasks.register('syncPackConfig', Copy) {
    into 'run'
    from('pack/config') { into 'config' }
    // Copied by Forge into every new world's serverconfig folder.
    from('pack/defaultconfigs') { into 'defaultconfigs' }
}
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn syncPackConfig
}

// Pack mods our code works with, loaded in the dev runs (PACK-004). None of them ship inside our jar.
repositories {
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config' // JEI's config library; ForgeGradle resolves it while remapping JEI
        }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }
    // Not exclusiveContent: ForgeGradle serves the remapped copies of these jars from its own local repository.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Trinket slots (CMBT-003): compile against the API, run the full mod.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    // Recipe viewer (PROG-002): same split. The JEI jar already contains its own modules and config library,
    // so the ones its pom lists must not be added again (duplicate packages crash Forge).
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")) { transitive = false }
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")) { transitive = false }
    runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")) { transitive = false }

    // Teams and quests (PROG-006, PROG-003). FTB Library and Architectury are their required mods.
    implementation(fg.deobf("dev.architectury:architectury-forge:${architectury_version}")) { transitive = false }
    implementation(fg.deobf("dev.ftb.mods:ftb-library-forge:${ftb_library_version}")) { transitive = false }
    implementation(fg.deobf("dev.ftb.mods:ftb-teams-forge:${ftb_teams_version}")) { transitive = false }
    implementation(fg.deobf("dev.ftb.mods:ftb-quests-forge:${ftb_quests_version}")) { transitive = false }

    // Item locks per team (PROG-002). History Stages requires Lootr.
    implementation fg.deobf("maven.modrinth:lootr:${lootr_version}")
    implementation fg.deobf("maven.modrinth:history-stages:${history_stages_version}")

    // Pack mods we don't call from code, loaded so dev runs match the pack (PACK-004).
    runtimeOnly fg.deobf("maven.modrinth:hourglass:${hourglass_version}") // day length (SURV-007)
    runtimeOnly fg.deobf("maven.modrinth:farmers-delight:${farmers_delight_version}") // food (SURV-008)
    runtimeOnly fg.deobf("maven.modrinth:a-balanced-diet:${balanced_diet_version}") // diet (SURV-009)
    runtimeOnly fg.deobf("maven.modrinth:appleskin:${appleskin_version}") // food values on screen (SURV-009)
    runtimeOnly fg.deobf("maven.modrinth:easy-npc-core:${easy_npc_core_version}") // NPCs (STORY-002, STORY-003)
    runtimeOnly fg.deobf("maven.modrinth:easy-npc-config-ui:${easy_npc_config_ui_version}")
    runtimeOnly fg.deobf("maven.modrinth:easy-npc:${easy_npc_version}")
    runtimeOnly fg.deobf("maven.modrinth:immersivecinematics:${immersive_cinematics_version}") // cutscenes (STORY-010)
    runtimeOnly fg.deobf("maven.modrinth:xaeros-minimap:${xaeros_minimap_version}") // maps (WORLD-003)
    runtimeOnly fg.deobf("maven.modrinth:xaeros-world-map:${xaeros_world_map_version}")
    runtimeOnly fg.deobf("maven.modrinth:embeddium:${embeddium_version}") // performance (PACK-003)
    runtimeOnly fg.deobf("maven.modrinth:modernfix:${modernfix_version}")
    runtimeOnly fg.deobf("maven.modrinth:ferrite-core:${ferrite_core_version}")
    runtimeOnly fg.deobf("maven.modrinth:decorative-blocks:${decorative_blocks_version}") // structure decoration (Q-148)
    runtimeOnly fg.deobf("maven.modrinth:another-furniture:${another_furniture_version}")
    runtimeOnly fg.deobf("maven.modrinth:just-barricades:${just_barricades_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
