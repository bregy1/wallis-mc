modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Teams (PROG-006): our "same team" checks ask FTB Teams.
[[dependencies.${mod_id}]]
    modId="ftbteams"
    mandatory=true
    versionRange="[2001.3,)"
    ordering="NONE"
    side="BOTH"

# Item locks (PROG-002, PROG-006): we read and change History Stages' per-team stages.
[[dependencies.${mod_id}]]
    modId="historystages"
    mandatory=true
    versionRange="[6.1,)"
    ordering="NONE"
    side="BOTH"
